# =====================================================================
# AeroLake — COMPLETE capture configuration template (TOML)
# ---------------------------------------------------------------------
# EVERY possible field is here. Keep what you need, DELETE the rest.
# Simple rule:
#   • (required) = must stay.
#   • (optional) = delete the line / the block if you do not need it
#                  (absent = simply not written into the metadata).
# Any UNKNOWN field is rejected (typo protection).
#
# Run it:  ./acquire.sh my_capture.toml      (or through the GUI: Capture tab)
# =====================================================================

# --- What to capture -------------------------------------------------
signal_type        = "gnss_l1"          # (required) category → MinIO folder + tag (gnss_l1, iridium, starlink, adsb, other…)
signal_type_detail = "L1 C/A"           # (optional) free-form precision (useful when signal_type = "other")
center_freq        = 1_575_420_000      # (required) centre frequency in Hz
sample_rate        = 2_000_000          # (required) sample rate in Hz (= captured bandwidth)
duration_s         = 10                 # (required) duration in seconds

# --- Descriptive metadata (all optional) ------------------------------
author      = "Theo Schmitt <theo.schmitt@lassena.etsmtl.ca>"   # (optional) core:author
description = "GNSS L1 capture, clear sky, active antenna on the roof"  # (optional) core:description
license     = "https://creativecommons.org/licenses/by-sa/4.0/"  # (optional) core:license (URL) — adapt to the lab policy
operator    = "schmitt"                 # (optional) defaults to your system login

# --- Source: where the signal comes from ------------------------------
# (optional — if the whole [source] block is absent, a synthetic source is used)
# Variant A: REAL SDR through SoapySDR
[source]
type    = "soapy"                       # (required inside the block)
driver  = "rtlsdr"                      # (optional, default rtlsdr) driver: rtlsdr, bladerf, hackrf…
agc     = true                          # (optional, default true)  automatic gain
antenna = "RX"                          # (optional) the SDR's antenna port (e.g. RX2 on BladeRF); delete for the default

# Variant B: SYNTHETIC SIGNAL (no hardware). To use it: delete the
# [source] block above and uncomment this one.
# [source]
# type           = "synthetic"
# tone_offset_hz = 100_000              # (optional) tone offset from center_freq
# snr_db         = 20.0                 # (optional) signal-to-noise ratio
# seed           = 1                    # (optional) random seed (reproducible capture)

# --- Where: the capture location (optional block) ---------------------
[location]
name   = "LASSENA roof, ETS Montreal"   # (required if the block is present); also becomes a searchable tag
mobile = false                          # (optional, default false) true if the receiver moves (vehicle)
gps    = false                          # (optional, default false) true = position read LIVE from gpsd
                                        #   ⚠ exclusive with [location.geolocation]: one OR the other, not both.

# Manual position (optional) — DELETE this block if gps = true
[location.geolocation]
latitude  = 45.4946                     # (required inside the block) degrees -90..90
longitude = -73.5623                    # (required inside the block) degrees -180..180
altitude  = 50.0                        # (optional) metres

# --- Annotation describing the whole capture (optional block) ---------
[annotation]
label           = "GPS L1 C/A"          # (optional) short label
comment         = "active antenna, clear sky"  # (optional) free-form comment
freq_lower_edge = 1_574_420_000         # (optional) occupied band — lower edge (Hz)
freq_upper_edge = 1_576_420_000         # (optional) upper edge (Hz)  ⚠ BOTH edges together, or neither

# --- SigMF antenna extension (optional block) -------------------------
# If the block is present, `model` is required; everything else is optional.
[antenna]
model                        = "Tallysman TW3742"     # (required if the block is present)
type                         = "active GNSS patch"    # (optional)
low_frequency                = 1_525_000_000          # (optional) Hz
high_frequency               = 1_610_000_000          # (optional) Hz
gain                         = 28.0                   # (optional) dBi
horizontal_beam_width        = 100.0                  # (optional) degrees
vertical_beam_width          = 100.0                  # (optional) degrees
cross_polar_discrimination   = 20.0                   # (optional) dB
voltage_standing_wave_ratio  = 1.5                    # (optional) VSWR
cable_loss                   = 2.0                    # (optional) dB
steerable                    = false                  # (optional)
mobile                       = false                  # (optional)
hagl                         = 1.5                    # (optional) height of the phase centre above ground (m)
# The next 3 describe the POINTING → the encoder puts them in the annotation (not the global antenna block):
polarization                 = "right-hand circular" # (optional)
azimuth_angle                = 90.0                   # (optional) degrees from North
elevation_angle              = 45.0                   # (optional) degrees from horizontal
