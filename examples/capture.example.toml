# =====================================================================
# AeroLake — modèle de configuration de capture (format TOML)
# ---------------------------------------------------------------------
# Copiez ce fichier, adaptez les valeurs, puis lancez :
#     uv run aerolake-capture --config ma_capture.toml
# (ou simplement ./acquire.sh ma_capture.toml)
#
# Le TOML autorise les commentaires (contrairement au JSON) : chaque champ
# est expliqué ci-dessous. Les champs marqués « optionnel » peuvent être
# supprimés. Tout champ inconnu est REJETÉ (sécurité anti-faute de frappe).
# =====================================================================

# --- Quoi capturer ---------------------------------------------------
signal_type        = "gnss_l1"          # catégorie (sert au rangement + aux tags MinIO)
signal_type_detail = "L1 C/A"           # optionnel : précision libre
center_freq        = 1_575_420_000      # fréquence centrale en Hz (GNSS L1 = 1575.42 MHz)
sample_rate        = 2_000_000          # taux d'échantillonnage en Hz (= bande passante)
duration_s         = 10                 # durée de la capture en secondes

# --- Métadonnées descriptives (optionnelles, écrites dans le .sigmf-meta) ---
author      = "Théo Schmitt <theo.schmitt@lassena.etsmtl.ca>"
description = "Capture GNSS L1 depuis le toit du labo"
license     = "https://creativecommons.org/licenses/by-sa/4.0/"
operator    = "schmitt"

# --- Source : d'où vient le signal -----------------------------------
# type = "soapy"     -> vrai SDR via SoapySDR (RTL-SDR, BladeRF, …)
# type = "synthetic" -> signal généré en logiciel (aucun matériel requis)
[source]
type    = "soapy"
driver  = "rtlsdr"   # pilote SoapySDR : "rtlsdr", "bladerf", …
agc     = true       # contrôle automatique de gain
# antenna = "RX"     # optionnel : port d'antenne du SDR

# Variante signal de test (décommentez ce bloc et supprimez celui du dessus) :
# [source]
# type          = "synthetic"
# tone_offset_hz = 100_000      # décalage de la tonalité vs la fréquence centrale
# snr_db         = 20.0         # rapport signal/bruit
# seed           = 1            # graine aléatoire (reproductible)

# --- Où : lieu de la capture (optionnel) -----------------------------
[location]
name   = "LASSENA, ETS Montréal"
mobile = false       # true si le récepteur est en mouvement (véhicule)
gps    = false       # true = lire UNE position live depuis gpsd au moment de la capture
                     #        (exclusif avec le bloc [location.geolocation] ci-dessous)

# Position manuelle (optionnelle) — supprimez si gps = true
[location.geolocation]
latitude  = 45.4946  # degrés décimaux (-90 à 90)
longitude = -73.5623 # degrés décimaux (-180 à 180)
altitude  = 50.0     # mètres (optionnel)

# --- Annotation décrivant toute la capture (optionnelle) -------------
[annotation]
label   = "GNSS L1 C/A"
comment = "ciel ouvert, antenne active"
# Bande occupée (les DEUX bornes ensemble, ou aucune) :
freq_lower_edge = 1_575_170_000
freq_upper_edge = 1_575_670_000

# --- Extension antenne SigMF (optionnelle) ---------------------------
# Si ce bloc est présent, `model` est obligatoire.
[antenna]
model = "Tallysman TW3742"
type  = "patch"          # optionnel
gain  = 28.0             # dBi (optionnel)
# polarization, azimuth_angle, elevation_angle… vont dans l'annotation (gérés par l'encodeur)
