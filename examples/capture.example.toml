# =====================================================================
# AeroLake — capture configuration template (TOML format)
# ---------------------------------------------------------------------
# Copy this file, adjust the values, then run:
#     uv run aerolake-capture --config my_capture.toml
# (or simply ./acquire.sh my_capture.toml)
#
# TOML allows comments (unlike JSON), so every field is explained below.
# Fields marked "optional" can be deleted. Any unknown field is REJECTED
# (typo protection).
# =====================================================================

# --- What to capture -------------------------------------------------
signal_type        = "gnss_l1"          # category (drives the storage layout + MinIO tags)
signal_type_detail = "L1 C/A"           # optional: free-form precision
center_freq        = 1_575_420_000      # centre frequency in Hz (GNSS L1 = 1575.42 MHz)
sample_rate        = 2_000_000          # sample rate in Hz (= captured bandwidth)
duration_s         = 10                 # capture duration in seconds

# --- Descriptive metadata (optional, written into the .sigmf-meta) ----
author      = "Theo Schmitt <theo.schmitt@lassena.etsmtl.ca>"
description = "GNSS L1 capture from the lab roof"
license     = "https://creativecommons.org/licenses/by-sa/4.0/"
operator    = "schmitt"

# --- Source: where the signal comes from ------------------------------
# type = "soapy"     -> real SDR through SoapySDR (RTL-SDR, BladeRF, …)
# type = "synthetic" -> signal generated in software (no hardware needed)
[source]
type    = "soapy"
driver  = "rtlsdr"   # SoapySDR driver: "rtlsdr", "bladerf", …
agc     = true       # automatic gain control
# antenna = "RX"     # optional: the SDR's antenna port

# Test-signal variant (uncomment this block and delete the one above):
# [source]
# type          = "synthetic"
# tone_offset_hz = 100_000      # tone offset from the centre frequency
# snr_db         = 20.0         # signal-to-noise ratio
# seed           = 1            # random seed (reproducible)

# --- Where: the capture location (optional) ---------------------------
[location]
name   = "LASSENA, ETS Montreal"
mobile = false       # true if the receiver is moving (vehicle)
gps    = false       # true = read ONE live fix from gpsd at capture time
                     #        (exclusive with the [location.geolocation] block below)

# Manual position (optional) — delete it if gps = true
[location.geolocation]
latitude  = 45.4946  # decimal degrees (-90 to 90)
longitude = -73.5623 # decimal degrees (-180 to 180)
altitude  = 50.0     # metres (optional)

# --- Annotation describing the whole capture (optional) ---------------
[annotation]
label   = "GNSS L1 C/A"
comment = "open sky, active antenna"
# Occupied band (BOTH edges together, or neither):
freq_lower_edge = 1_575_170_000
freq_upper_edge = 1_575_670_000

# --- SigMF antenna extension (optional) -------------------------------
# If this block is present, `model` is required.
[antenna]
model = "Tallysman TW3742"
type  = "patch"          # optional
gain  = 28.0             # dBi (optional)
# polarization, azimuth_angle, elevation_angle… go into the annotation (handled by the encoder)
