[project]
name = "aerolake"
version = "0.1.0"
description = "RF data lakehouse pipeline — SigMF captures into MinIO with ZMQ extraction bus"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Schmitt Théo", email = "theo.schmitt02@gmail.com" },
]
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "matplotlib>=3.8.0",
    "numpy>=2.0.0",
    "pydantic>=2.6.0",
    "pyzmq>=26.0.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "sigmf>=1.2.0",
    "structlog>=24.1.0",
]

[project.scripts]
aerolake-healthcheck = "aerolake.scripts.healthcheck:main"
aerolake-capture = "aerolake.scripts.capture:main"
aerolake-ingest = "aerolake.scripts.ingest:main"
aerolake-list = "aerolake.scripts.catalog:main"
aerolake-collection = "aerolake.scripts.collection:main"
aerolake-play = "aerolake.scripts.play:main"
aerolake-stream = "aerolake.scripts.stream:main"
aerolake-subscribe = "aerolake.scripts.subscribe:main"
aerolake-gui = "aerolake.gui.app:run"

# Optional extra: the Streamlit web GUI (a click-to-capture front-end for
# non-technical users). Kept out of the core deps so a CLI-only install stays
# lean. Install with:  uv sync --extra gui
[project.optional-dependencies]
gui = [
    "streamlit>=1.40.0",
    "streamlit-folium>=0.20.0",  # click-to-pick map for the antenna location
]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "moto[s3]>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The FakeDevice in this test mirrors SoapySDR's camelCase device API
# (setSampleRate, readStream, timeoutUs, ...), so its method/argument names must
# match exactly — N802/N803 (lowercase naming) do not apply to that mimicry.
"tests/producer/test_soapy_recorder.py" = ["N802", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "integration: real round-trip against a live MinIO (opt-in via AEROLAKE_RUN_INTEGRATION=1)",
]

[tool.mypy]
python_version = "3.12"
# The pydantic plugin teaches mypy that BaseSettings fields are populated from
# the environment, so `Settings()` with no args is valid (not a missing-arg).
plugins = ["pydantic.mypy"]

# Third-party libraries that ship no type stubs / py.typed marker. Without this
# mypy emits "missing library stubs" errors for imports we don't control.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "sigmf.*", "SoapySDR.*", "streamlit.*", "folium.*", "streamlit_folium.*"]
ignore_missing_imports = true
