[project]
name = "aerolake"
version = "0.1.0"
description = "RF data lakehouse pipeline — SigMF captures into MinIO with ZMQ extraction bus"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Schmitt Théo", email = "theo.schmitt02@gmail.com" },
]
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "numpy>=2.0.0",
    "pydantic>=2.6.0",
    "pyzmq>=26.0.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "sigmf>=1.2.0",
    "structlog>=24.1.0",
]

[project.scripts]
aerolake-healthcheck = "aerolake.scripts.healthcheck:main"
aerolake-producer = "aerolake.scripts.producer:main"
aerolake-ingest = "aerolake.scripts.ingest:main"
aerolake-validate = "aerolake.scripts.validate:main"
aerolake-list = "aerolake.scripts.catalog:main"
aerolake-play = "aerolake.scripts.play:main"
aerolake-stream = "aerolake.scripts.stream:main"
aerolake-subscribe = "aerolake.scripts.subscribe:main"
aerolake-fetch = "aerolake.scripts.fetch:main"
aerolake-gui = "aerolake.gui.launch:main"
aerolake-analysis = "aerolake.analysis.launch:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "moto[s3]>=5.0.0",
    # plotly lives here too (not just in the gui group) so the pure plot
    # functions in aerolake.gui.plots can be unit-tested in CI without pulling
    # in the heavier streamlit runtime. h5py is here so the Iridium analysis
    # loader (aerolake.analysis.iridium) is testable in CI.
    "plotly>=5.24.0",
    "h5py>=3.10.0",
]

# Optional GUI runtime. Install with `uv sync --group gui`; run the app with
# `uv run --group gui aerolake-gui`. Kept out of the core dependencies so the
# pipeline/CLIs stay lean and don't drag in the web stack.
gui = [
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "h5py>=3.10.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "integration: real round-trip against a live MinIO (opt-in via AEROLAKE_RUN_INTEGRATION=1)",
]

[tool.mypy]
python_version = "3.12"
# The pydantic plugin teaches mypy that BaseSettings fields are populated from
# the environment, so `Settings()` with no args is valid (not a missing-arg).
plugins = ["pydantic.mypy"]

# Third-party libraries that ship no type stubs / py.typed marker. Without this
# mypy emits "missing library stubs" errors for imports we don't control.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "sigmf.*", "streamlit.*", "plotly.*", "h5py.*"]
ignore_missing_imports = true
