name: CI

# Run on every push to main and on every pull request targeting it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when new commits are pushed to the same ref,
# so we don't burn minutes validating a commit that's already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Cache the uv download cache keyed on the lockfile for fast installs.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --frozen: install exactly what uv.lock pins; fail if it's out of date.
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Tests (pytest)
        # Unit tests are self-contained: moto mocks S3, so no MinIO is needed.
        # The integration test (real MinIO) runs in its own job below.
        run: uv run pytest -m "not integration"

  integration:
    name: Integration (real MinIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MinIO
        # `minio/minio` needs the `server` command, which GitHub Actions
        # `services:` can't pass — so we run it as a plain container.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Integration tests (real MinIO round-trip)
        env:
          AEROLAKE_RUN_INTEGRATION: "1"
          AEROLAKE_S3_ENDPOINT: http://localhost:9000
          AEROLAKE_S3_ACCESS_KEY: minioadmin
          AEROLAKE_S3_SECRET_KEY: minioadmin
          AEROLAKE_S3_BUCKET: aerolake-ci
          AEROLAKE_S3_REGION: us-east-1
        run: uv run pytest -m integration
